<style>
/* Layout: one exam paper at a time. Sticky top bar with part stepper, white "paper" card, question cards inside. */
:root{
  --bg:#e9eef4; --paper:#ffffff; --ink:#0f1b2d; --muted:#586a80; --line:#d3dce7;
  --accent:#0a6a6a; --accent-ink:#ffffff; --mark:#ffd84d; --mark-ink:#2a2200; --soft:#f2f6fa;
  --display:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --arabic:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b131e; --paper:#142133; --ink:#e7eef7; --muted:#9bb0c7; --line:#2a3b50;
  --accent:#3dc1b8; --accent-ink:#04211f; --mark:#e3c249; --mark-ink:#241d00; --soft:#1a2a3f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b131e; --paper:#142133; --ink:#e7eef7; --muted:#9bb0c7; --line:#2a3b50;
  --accent:#3dc1b8; --accent-ink:#04211f; --mark:#e3c249; --mark-ink:#241d00; --soft:#1a2a3f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:18px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.brand{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.02em;text-transform:uppercase}
.clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.steps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.steps button{flex:1 0 auto;min-width:92px;text-align:left;border:1px solid var(--line);background:var(--paper);color:var(--muted);
  padding:7px 10px;border-radius:6px;font:inherit;font-size:13px;cursor:pointer}
.steps button b{display:block;color:var(--ink);font-size:14px}
.steps button[aria-current="step"]{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.steps button[aria-current="step"] b{color:var(--mark-ink)}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:clamp(16px,4vw,32px)}
.paper h1{font-size:clamp(28px,6vw,40px);font-weight:800}
.paper h2{font-size:clamp(22px,4.5vw,28px);font-weight:800}
.lead{color:var(--muted);margin:10px 0 0}
.ar{font-family:var(--arabic);direction:rtl;text-align:right;color:var(--muted);font-size:15px;line-height:1.7;margin:6px 0 0}
.rules{margin:22px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.rules li{display:grid;grid-template-columns:1fr;gap:0;padding:12px 14px;background:var(--soft);border-radius:8px}
.field{display:grid;gap:6px;margin-top:22px}
.field label{font-weight:700}
input[type=text],select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
input[type=text]:focus,select:focus,textarea:focus{outline:3px solid var(--mark);outline-offset:0;border-color:var(--ink)}
textarea{min-height:130px;resize:vertical}
.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:12px 20px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.steps button:focus-visible,.opt:focus-within{outline:3px solid var(--mark);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
.task{margin-top:30px}
.task:first-of-type{margin-top:22px}
.tag{display:inline-block;font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:3px 9px;border-radius:4px}
.task h3{margin-top:10px;font-size:19px;font-weight:600;font-family:var(--body)}
.audio{margin:16px 0 4px}
.audio audio{width:100%;display:block}
.pre{margin:14px 0 0;padding:14px 16px;background:var(--soft);border-radius:8px;border-left:4px solid var(--ink)}
.pre p{margin:0 0 8px}.pre p:last-child{margin:0}
.form{margin:14px 0 0;padding:12px 16px;border:1.5px dashed var(--muted);border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.chips span{padding:3px 10px;border:1.5px solid var(--ink);border-radius:999px;font-size:15px}
.qs{display:grid;gap:14px;margin-top:16px}
.q{display:grid;grid-template-columns:38px 1fr;gap:12px;padding-top:14px;border-top:1px solid var(--line)}
.num{font-family:var(--display);font-weight:800;font-size:18px;width:34px;height:34px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:50%;font-variant-numeric:tabular-nums}
.qt{margin:4px 0 10px;font-weight:700}
.notice{margin:4px 0 10px;padding:8px 12px;border:2px solid var(--ink);border-radius:4px;text-transform:none;font-weight:700;letter-spacing:.01em}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative;display:flex;align-items:center;gap:8px;padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer;background:var(--paper)}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt .L{font-family:var(--display);font-weight:800;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:var(--soft);font-size:14px;flex:none}
.opt:has(input:checked){background:var(--mark);border-color:var(--mark);color:var(--mark-ink)}
.opt:has(input:checked) .L{background:var(--mark-ink);color:var(--mark)}
.opts.stack{flex-direction:column;align-items:stretch}
@media (max-width:480px){.q{grid-template-columns:1fr}.num{width:30px;height:30px}}
.count{color:var(--muted);font-size:14px;margin-top:6px}
.warn{margin-top:18px;padding:14px;border:2px solid var(--ink);border-radius:8px;background:var(--soft)}
.report{width:100%;min-height:260px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.45}
details{margin-top:18px}summary{cursor:pointer;font-weight:700}
.ok{color:var(--accent);font-weight:700}
.small{font-size:14px;color:var(--muted)}
.mail{user-select:all;font-weight:700}
</style>

</head>

/* ---------- state ---------- */
var st={name:"",ans:{},screen:"intro",part:0,start:null};
try{var d=JSON.parse(localStorage.getItem(KEY)||"null");if(d&&d.ans){st.ans=d.ans;st.name=d.name||"";}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({ans:st.ans,name:st.name}));}catch(e){}}

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
var LET="ABCDEFGH";
function norm(s){return String(s).replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d);}).toLowerCase().replace(/['’`]/g,"").replace(/[^a-z0-9]+/g," ").trim();}
function lev(a,b){var m=a.length,n=b.length,i,j,p=[],c;for(j=0;j<=n;j++)p[j]=j;for(i=1;i<=m;i++){c=[i];for(j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function textOk(v,it){
  v=String(v||"").trim();if(!v)return false;
  if(it.digits)return v.replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d);}).replace(/\D/g,"")===it.acc[0];
  var n=norm(v);
  return it.acc.some(function(a){return n===a||(!it.exact&&a.length>=5&&!/\d/.test(a)&&n[0]===a[0]&&lev(n,a)<=2);});
}
function itemOk(it){
  var v=st.ans[it.n];
  if(it.k==="mcq")return v===String(it.a);
  if(it.k==="sel")return v===it.a;
  if(it.k==="text")return textOk(v,it);
  return false;
}
function grade(){
  var parts=[],auto=0,max=0;
  PARTS.forEach(function(p){var s=0,m=0;
    p.tasks.forEach(function(t){t.items.forEach(function(it){if(it.k==="man"||it.k==="msg")return;m++;if(itemOk(it))s++;});});
    parts.push({id:p.id,name:p.name,s:s,m:m});auto+=s;max+=m;});
  return {parts:parts,auto:auto,max:max};
}
function band(pct){
  if(pct<=25)return "A0 - absolute beginner: start the A0 course from Session 1";
  if(pct<=45)return "A0 - knows the basics: A0 course, extra speaking and pronunciation practice";
  if(pct<=65)return "Borderline (advanced Pre-A1 / low A1): 3-minute speaking interview to decide";
  return "A1 or above: does not need A0";
}
function wc(s){var m=String(s||"").trim().match(/\S+/g);return m?m.length:0;}
function allItems(){var a=[];PARTS.forEach(function(p){p.tasks.forEach(function(t){t.items.forEach(function(it){a.push(it);});});});return a;}
function unanswered(){return allItems().filter(function(it){if(it.k==="msg")return false;return !String(st.ans[it.n]||"").trim();}).map(function(it){return it.n;});}
function ansText(it){var v=st.ans[it.n];if(v===undefined||v==="")return "-";if(it.k==="mcq")return LET[+v];return String(v);}

function buildReport(){
  var g=grade(),pct=Math.round(g.auto/g.max*100),mins=st.start?Math.max(1,Math.round((Date.now()-st.start)/60000)):0;
  var L=[];
  L.push("A0 ENGLISH PLACEMENT TEST — RESULT");
  L.push("Name: "+(st.name||"(no name)"));
  L.push("Date: "+new Date().toLocaleDateString("en-GB")+"   Time taken: "+mins+" min");
  L.push("");
  L.push("AUTO SCORE: "+g.auto+" / "+g.max+" ("+pct+"%)");
  L.push(g.parts.map(function(p){return p.name+" "+p.s+"/"+p.m;}).join(" | "));
  L.push("Provisional level: "+band(pct));
  L.push("(Writing Task 2 = 5 marks and the message = 10 marks are still to be marked by the teacher. Final total = auto score + writing marks, out of 100.)");
  L.push("");
  L.push("WRITING TASK 2");
  [86,87,88,89,90].forEach(function(n){L.push(n+": "+(st.ans[n]||"-"));});
  L.push("");
  L.push("MESSAGE ("+wc(st.ans.msg)+" words)");
  L.push(st.ans.msg||"-");
  L.push("");
  L.push("ANSWERS");
  var row=[];allItems().forEach(function(it){if(it.k==="man"||it.k==="msg")return;row.push(it.n+" "+ansText(it));});
  L.push(row.join(" | "));
  return L.join("\n");
}

/* ---------- rendering ---------- */
var app=document.getElementById("app"),bar=document.getElementById("bar"),stepsEl=document.getElementById("steps"),clock=document.getElementById("clock");

function renderSteps(){
  stepsEl.innerHTML=PARTS.map(function(p,i){
    var tot=0,done=0;p.tasks.forEach(function(t){t.items.forEach(function(it){if(it.k==="msg")return;tot++;if(String(st.ans[it.n]||"").trim())done++;});});
    return '<button type="button" data-go="'+i+'"'+(st.screen==="part"&&st.part===i?' aria-current="step"':'')+'><b>'+(i+1)+' · '+p.name+'</b>'+done+'/'+tot+'</button>';
  }).join("");
}

function qHtml(it,t){
  var v=st.ans[it.n];
  if(it.k==="msg"){return '<div class="field" style="margin-top:14px"><label for="f-msg">Hi Sam,</label><textarea id="f-msg" data-n="msg" placeholder="Write here…">'+esc(v||"")+'</textarea><div class="count" id="wc">'+wc(v)+' words</div></div>';}
  var head='<div class="q"><div class="num">'+it.n+'</div><div>';
  var body="";
  if(it.notice)body+='<div class="notice">'+esc(it.notice)+'</div>';
  if(it.k==="mcq"){
    if(!/^Which (word|sentence)/.test(it.q))body+='<p class="qt">'+esc(it.q)+'</p>';
    body+='<div class="opts'+(it.stack?' stack':'')+'" role="radiogroup" aria-label="Question '+it.n+'">'+it.o.map(function(o,i){
      return '<label class="opt"><input type="radio" name="q'+it.n+'" data-n="'+it.n+'" value="'+i+'"'+(v===String(i)?' checked':'')+'><span class="L">'+LET[i]+'</span><span>'+esc(o)+'</span></label>';}).join("")+'</div>';
  }else if(it.k==="text"){
    body+='<label class="qt" for="f'+it.n+'">'+esc(it.q)+'</label><input type="text" id="f'+it.n+'" data-n="'+it.n+'" autocomplete="off" autocapitalize="off" spellcheck="false"'+(it.digits?' inputmode="numeric"':'')+' placeholder="'+esc(it.ph||"")+'" value="'+esc(v||"")+'">';
  }else if(it.k==="sel"){
    body+='<label class="qt" for="f'+it.n+'">'+esc(it.q)+'</label><select id="f'+it.n+'" data-n="'+it.n+'"><option value="">Choose…</option>'+t.opts.map(function(o){return '<option'+(v===o?' selected':'')+'>'+esc(o)+'</option>';}).join("")+'</select>';
  }else if(it.k==="man"){
    body+='<label class="qt" for="f'+it.n+'">'+esc(it.q)+'</label><input type="text" id="f'+it.n+'" data-n="'+it.n+'" autocomplete="off" placeholder="Write one sentence" value="'+esc(v||"")+'">';
  }
  return head+body+'</div></div>';
}

function audioHtml(t){
  return '<div class="audio"><audio controls preload="metadata" src="'+t.audio+'">Your browser does not support audio.</audio></div>';
}

function renderPart(){
  var p=PARTS[st.part],h='<div class="paper"><h2>Part '+(st.part+1)+' — '+p.name+'</h2>';
  p.tasks.forEach(function(t,ti){
    h+='<section class="task"><span class="tag">'+esc(t.tag)+'</span><h3>'+esc(t.en)+'</h3>';
    if(t.audio)h+=audioHtml(t);
    if(t.chips)h+='<div class="chips">'+t.chips.map(function(c){return '<span>'+esc(c)+'</span>';}).join("")+'</div>';
    if(t.pre)h+='<div class="'+(t.formbox?'form':'pre')+'">'+t.pre+'</div>';
    h+='<div class="qs">'+t.items.map(function(it){return qHtml(it,t);}).join("")+'</div></section>';
  });
  var last=st.part===PARTS.length-1;
  h+='<div class="nav"><button type="button" class="btn ghost" data-nav="-1"'+(st.part===0?' disabled':'')+'>← Back</button>'+
     '<button type="button" class="btn" data-nav="1">'+(last?'Finish':'Next →')+'</button></div></div>';
  app.innerHTML=h;
}

function renderIntro(){
  app.innerHTML='<div class="paper"><h1>English A0<br>Placement Test</h1>'+
  '<p class="lead">5 parts · about 75–90 minutes · Listening, Vocabulary, Grammar, Reading, Writing.</p>'+
  '<div class="field"><label for="nm">Your full name</label><input type="text" id="nm" autocomplete="name" value="'+esc(st.name)+'"></div>'+
  '<div class="row" style="margin-top:22px"><button type="button" class="btn" id="go">Start the test</button><span class="small" id="nmerr"></span></div></div>';
}

function renderReview(){
  var un=unanswered();
  app.innerHTML='<div class="paper"><h2>Ready to finish?</h2>'+
  (un.length?'<div class="warn"><b>'+un.length+' question'+(un.length>1?'s are':' is')+' still empty:</b> '+un.join(", ")+'</div>':'<p class="lead">All questions have an answer.</p>')+
  '<div class="nav"><button type="button" class="btn ghost" id="back">← Go back</button><button type="button" class="btn" id="fin">Finish and send</button></div></div>';
}

function renderDone(){
  var rep=buildReport(),subj="A0 Placement Test — "+(st.name||"student");
  var mail="mailto:"+TEACHER_EMAIL+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(rep);
  var wa="https://wa.me/?text="+encodeURIComponent(rep);
  app.innerHTML='<div class="paper"><h2>Test finished. Thank you, <span id="who"></span>.</h2>'+
  '<p class="lead">Now send your result to your teacher. Your teacher will tell you your level.</p>'+
  '<div class="row" style="margin-top:18px"><button type="button" class="btn" id="copy">Copy my result</button><a class="btn ghost" style="text-decoration:none" href="'+wa+'" target="_blank" rel="noopener">Send by WhatsApp</a></div>'+
  '<p class="small" id="cs" style="margin-top:10px"></p>'+
  '<p style="margin-top:14px">Email: <span class="mail">'+TEACHER_EMAIL+'</span> <a href="'+mail+'" target="_blank" rel="noopener">open email app</a></p>'+
  '<p class="small">If the email app does not open, copy the result above and paste it in an email to this address.</p>'+
  '<details><summary>Show my result text</summary><textarea class="report" id="rep" readonly></textarea></details></div>';
  document.getElementById("who").textContent=st.name||"";
  document.getElementById("rep").value=rep;
}

function render(){
  bar.hidden=st.screen==="intro"||st.screen==="done";
  if(st.screen==="intro")renderIntro();
  else if(st.screen==="part"){renderSteps();renderPart();}
  else if(st.screen==="review"){renderSteps();renderReview();}
  else renderDone();
  window.scrollTo(0,0);
}

/* ---------- audio: starting one player pauses the others ---------- */
document.addEventListener("play",function(e){
  document.querySelectorAll("audio").forEach(function(a){if(a!==e.target)a.pause();});
},true);

/* ---------- events ---------- */
document.addEventListener("input",function(e){
  var t=e.target,n=t.getAttribute&&t.getAttribute("data-n");
  if(!n)return;
  st.ans[n]=t.value;save();
  if(n==="msg"){var w=document.getElementById("wc");if(w)w.textContent=wc(t.value)+" words";}
  renderStepsKeep();
});
document.addEventListener("change",function(e){
  var t=e.target,n=t.getAttribute&&t.getAttribute("data-n");
  if(!n)return;st.ans[n]=t.value;save();renderStepsKeep();
});
function renderStepsKeep(){if(st.screen==="part")renderSteps();}
document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest("button");if(!b)return;
  if(b.id==="go"){
    var nm=document.getElementById("nm").value.trim();
    if(!nm){document.getElementById("nmerr").textContent="Please write your name";return;}
    st.name=nm;save();st.start=Date.now();st.screen="part";st.part=0;render();return;
  }
  if(b.hasAttribute("data-go")){st.screen="part";st.part=+b.getAttribute("data-go");render();return;}
  if(b.hasAttribute("data-nav")){
    var d=+b.getAttribute("data-nav");
    if(d>0&&st.part===PARTS.length-1){st.screen="review";render();return;}
    st.part+=d;render();return;
  }
  if(b.id==="back"){st.screen="part";st.part=PARTS.length-1;render();return;}
  if(b.id==="fin"){st.screen="done";render();return;}
  if(b.id==="copy"){
    var txt=document.getElementById("rep").value,cs=document.getElementById("cs");
    var fallback=function(){var d=document.querySelector("details");d.open=true;var r=document.getElementById("rep");r.focus();r.select();cs.textContent="Select all the text below and copy it.";};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){cs.textContent="Copied ✓ Now paste it in WhatsApp or email";cs.className="ok";},fallback);}else fallback();
  }
});
setInterval(function(){if(st.start&&clock&&!bar.hidden){var s=Math.floor((Date.now()-st.start)/1000);clock.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}},1000);

render();
})();
</script>

</html>
